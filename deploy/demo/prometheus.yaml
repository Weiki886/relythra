global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: relythra-demo
    env: demo
scrape_configs:
  - job_name: demo
    static_configs:
      - targets: [orders:8080]
        labels: {project: relythra-demo, service: orders, env: demo, host_id: demo-host, runtime_type: docker-compose}
      - targets: [inventory:8080]
        labels: {project: relythra-demo, service: inventory, env: demo, host_id: demo-host, runtime_type: docker-compose}
  - job_name: relythra-worker
    static_configs:
      - targets: [worker:8081]
        labels: {project: relythra, service: worker, env: demo}
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels: {project: relythra-demo, service: host, env: demo, host_id: demo-host}
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels: {project: relythra-demo, service: runtime, env: demo, host_id: demo-host, runtime_type: docker-compose, mapping_status: raw_cgroup_only}
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
        labels: {project: relythra-demo, service: log-collector, env: demo}
